name: Java CI with Jdbld

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: doc_generation
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    # jdk 25 and xmlstarlet for jdbld, and graphviz for javadoc, 
    - name: Install required packages
      run: sudo apt-get update && sudo apt-get install xmlstarlet graphviz
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Build with jdbld
      run: ./jdbld build javadoc
